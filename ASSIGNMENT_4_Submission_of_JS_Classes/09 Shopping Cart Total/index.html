<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart Total</title>
</head>
<body>
    <h1>Shopping Cart</h1>

    <h3>Apply Coupon</h3>

    <label for="coupon">Enter Coupon Code:</label>
    <input type="text" id="coupon" placeholder="SAVE20">
    <button id="applyBtn">Apply Coupon</button>

    <p id="message"></p>

    <h3>Cart Details</h3>
    <div id="cartDetails"></div>

    <h3 id="total"></h3>
    <h3 id="discount"></h3>
    <h2 id="finalTotal"></h2>

    <script src="script.js"></script>
</body>
</html>
