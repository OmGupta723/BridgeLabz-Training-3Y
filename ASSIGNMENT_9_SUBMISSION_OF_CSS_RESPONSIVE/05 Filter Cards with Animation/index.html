<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Our Team</h1>

    <section class="cards">

        <div class="card">
            <img class="gray" src="https://picsum.photos/300/200?1" alt="Person">
            <h2>Rahul</h2>
            <p>Web Developer</p>
        </div>

        <div class="card">
            <img class="sepia" src="https://picsum.photos/300/200?2" alt="Person">
            <h2>Aman</h2>
            <p>UI Designer</p>
        </div>

        <div class="card">
            <img class="gray" src="https://picsum.photos/300/200?3" alt="Person">
            <h2>Riya</h2>
            <p>Data Analyst</p>
        </div>

    </section>
</body>
</html>
