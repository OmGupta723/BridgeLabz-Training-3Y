<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="product-card">
        <div class="product-image">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800&auto=format&fit=crop" alt="Running shoes">
        <span class="discount">20% OFF</span>
        <button class="heart">♡</button>
    </div>

    <div class="product-info">
        <p class="category"> SPORT SHOES</p>
        <h2>Premium Running Shoes</h2>
        <div class="rating">
            <span class="stars">★★★★★</span>
            <span class="reviews">(120)</span>
        </div>
        <div class="price">
            <span class="current-price">₹1,999</span>
            <span class="old-price">₹2,499</span>
        </div>
        <button class="cart-button">Add to Cart</button>
    </div>
    </div>
</body>
</html>
