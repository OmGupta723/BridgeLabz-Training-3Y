<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <!-- Product Image Container -->
        <div class="image-section">
            <span class="discount-badge">20% OFF</span>
            <button class="wishlist-btn" aria-label="Wishlist">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            </button>
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800&auto=format&fit=crop" alt="Nike Running Shoes" class="product-image">
        </div>

        <!-- Product Details Container -->
        <div class="details-section">
            <span class="category">SPORTS SHOES</span>
            <h2 class="title">Premium Running Shoes</h2>
            
            <div class="rating-container">
                <div class="stars">★★★★★</div>
                <span class="rating-count">(120)</span>
            </div>

            <div class="price-container">
                <span class="current-price">&#8377;1,999</span>
                <span class="original-price">&#8377;2,499</span>
            </div>

            <button class="add-to-cart-btn">Add to Cart</button>
        </div>
        
    </div>
</body>
</html>
