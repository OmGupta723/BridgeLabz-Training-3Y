
<!DOCTYPE html>
<html>
<head>
    <title>Student Table Filter</title>
</head>
<body>
    <h2>Student List</h2>

    <input id="search" placeholder="Search students">

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Branch</th>
            <th>CGPA</th>
        </tr>
        <tbody id="students">
            <tr><td>Amit</td><td>CSE</td><td>8.2</td></tr>
            <tr><td>Neha</td><td>AI</td><td>9.1</td></tr>
            <tr><td>Rahul</td><td>ECE</td><td>7.8</td></tr>
            <tr><td>Sara</td><td>CSE</td><td>8.7</td></tr>
        </tbody>
    </table>

    <p id="message"></p>

    <script>
        let search = document.getElementById("search");
        let rows = document.querySelectorAll("#students tr");
        let message = document.getElementById("message");

        search.addEventListener("input", function() {
            let text = search.value.toLowerCase();
            let found = 0;

            for (let i = 0; i < rows.length; i++) {
                let rowText = rows[i].textContent.toLowerCase();

                if (rowText.includes(text)) {
                    rows[i].style.display = "";
                    found++;
                } else {
                    rows[i].style.display = "none";
                }
            }

            if (found === 0) {
                message.textContent = "No results found";
            } else {
                message.textContent = "";
            }
        });
    </script>
</body>
</html>
