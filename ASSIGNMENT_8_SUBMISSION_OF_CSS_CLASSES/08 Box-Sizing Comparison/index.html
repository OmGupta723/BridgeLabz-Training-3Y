<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="box default">
            <h2>Default Box</h2>
            <p>This box uses the default box-sizing.</p>
        </div>

        <div class="box border-box">
            <h2>Border Box</h2>
            <p>This box uses box-sizing: border-box.</p>
        </div>
    </div>
</body>
</html>
